  window.findBus = function() {
    try {
        const dateEl = document.getElementById("date");
        const timeEl = document.getElementById("time");
        const date = dateEl ? dateEl.value : null;
        const time = timeEl ? timeEl.value : null;
        if (!date || !time) {
            alert("Please select both Date and Time!");
            return;
        }

        let formattedTime = time;
        if (time) {
            const [h, m] = time.split(':');
            const hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const hours12 = hours % 12 || 12;
            formattedTime = `${hours12}:${m} ${ampm}`;
        }
        
        let formattedDate = date;
        if (date) {
            const [year, month, day] = date.split('-');
            formattedDate = `${day}-${month}-${year}`;
        }
        
        alert(`Selected Date: ${formattedDate}\nSelected Time: ${formattedTime}`);
        console.log(`Selected Date: ${formattedDate}`);
        console.log(`Selected Time: ${formattedTime}`);
        
        const resultEl = document.getElementById("result");
        if (resultEl) {
            resultEl.innerText = `Selected Date: ${formattedDate} | Selected Time: ${formattedTime}`;
        }
    } catch (err) {
        console.error("Error in findBus:", err);
    }
  };

  document.addEventListener("DOMContentLoaded", function () {

    }

    if (timeInput) {

          this.setAttribute("value", this.value); // ensure visible
        }
      });
    }
  });

    function rtm(r){const d=r.indexOf('\u2013');const s=r.substring(0,d).trim();const e=r.substring(d+1).trim();const p=/PM/i.test(e)?'PM':'AM';const[h,m]=s.split(':').map(Number);let hr=h;if(p==='PM'&&h!==12)hr+=12;if(p==='AM'&&h===12)hr=0;return hr*60+m;}
    function hm(t){const[h,m]=String(t).split(':').map(Number);return h*60+m;}
    function freq(ts){if(!ts||ts.length<2)return 'Low';const ms=ts.map(rtm);let tot=0;for(let i=1;i<ms.length;i++)tot+=ms[i]-ms[i-1];const avg=tot/(ms.length-1);return avg<30?'High':avg<=90?'Medium':'Low';}
    function findBus(from,to,cur){
      const f=nc(from),t=nc(to);
      const route=R.find(r=>r.from.toLowerCase()===f.toLowerCase()&&r.to.toLowerCase()===t.toLowerCase());
      if(!route)return{from:f,to:t,currentTime:cur,status:'No route found',message:'No direct buses available for this route',nextBus:null,upcomingBuses:[],allTimings:[],frequency:null,demand:null,firstBus:null,lastBus:null,note:'Try another route'};
      const cm=hm(cur),fb=rtm(route.firstBus),lb=rtm(route.lastBus),fq=freq(route.timings);
      const up=route.timings.filter(t=>rtm(t)>=cm);
      const base={from:f,to:t,currentTime:cur,frequency:fq,demand:route.demand,firstBus:route.firstBus,lastBus:route.lastBus,allTimings:route.timings,note:'Timings are approximate and may vary'};
      if(cm<fb)return{...base,status:'Not started',message:'First bus has not started yet',nextBus:route.firstBus,upcomingBuses:route.timings};
      if(cm>lb)return{...base,status:'No buses now',message:'No more buses today. Resumes tomorrow.',nextBus:route.firstBus+' (tomorrow)',upcomingBuses:[]};
      return{...base,status:'Available',message:'Bus available',nextBus:up[0],upcomingBuses:up};
    }
    g.KSRTCEngine={findBus,ROUTES:R,normalizeCity:nc};
  })(window);

              return Math.min(next, 100);
            });
          }, 800);

        return () => clearInterval(interval);

      // Three.js Particle Background
      useEffect(() => {
        if (typeof THREE === 'undefined') return;
        const canvas = document.getElementById('bg-canvas');
        if (!canvas) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
          posArray[i] = (Math.random() - 0.5) * 5;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const pMaterial = new THREE.PointsMaterial({ size: 0.005, color: '#dc2626' }); 
        const particlesMesh = new THREE.Points(particlesGeometry, pMaterial);
        scene.add(particlesMesh);
        
        camera.position.z = 2;

        let mouseX = 0;
        let mouseY = 0;

        const handleMouseMove = (event) => {
          mouseX = event.clientX / window.innerWidth - 0.5;
          mouseY = event.clientY / window.innerHeight - 0.5;
        };

        window.addEventListener('mousemove', handleMouseMove);

        let frameId;
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          particlesMesh.rotation.y += 0.001;
          particlesMesh.rotation.x += 0.001;
          
          particlesMesh.position.x += (mouseX * 0.5 - particlesMesh.position.x) * 0.05;
          particlesMesh.position.y += (-mouseY * 0.5 - particlesMesh.position.y) * 0.05;
          
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          scene.remove(particlesMesh);
          particlesGeometry.dispose();
          pMaterial.dispose();
          renderer.dispose();
        };
      }, []);

        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {

          reader.readAsDataURL(file);
        }

      // Convert "HH:MM" or range-start like "06:30" + period to minutes
      const toMins = (hhmm) => {
        try {
          if (!hhmm) return 0;
          const [h, m] = String(hhmm).split(':').map(Number);
          return (isNaN(h) || isNaN(m)) ? 0 : h * 60 + m;
        } catch (err) {
          console.error("Error in toMins:", err);
          return 0;
        }
      };

      // Convert engine timing range "06:30\u201306:45 AM" to 24h minutes
      const rangeToMins = (range) => {
        try {
          if (!range) return 0;
          const dash = range.indexOf('\u2013');
          if (dash === -1) return 0;
          const start = range.substring(0, dash).trim();
          const end   = range.substring(dash + 1).trim();
          const pm    = /PM/i.test(end);
          const parts = start.split(':');
          if (parts.length < 2) return 0;
          const [h, m] = parts.map(Number);
          let hr = h;
          if (pm && h !== 12) hr += 12;
          if (!pm && h === 12) hr = 0;
          return hr * 60 + m;
        } catch (err) {
          console.error("Error in rangeToMins:", err);
          return 0;
        }
      };

      const handleCheckTiming = () => {

          const timeEl = document.getElementById("time");

          const time = timeEl ? timeEl.value : selectedTime;

          if (!date || !time) {
            alert("Please select both Date and Time!");
            return;

          let formattedTime = time;
          let formattedDate = date;

          if (time) {
            const [h, m] = time.split(':');
            const hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const hours12 = hours % 12 || 12;
            formattedTime = `${hours12}:${m} ${ampm}`;

          if (date) {

            formattedDate = `${day}-${month}-${year}`;

                                  <button onClick={() => { setTrackingActive({ from: r.from, to: r.to, nextBus: r.nextBus || r.upcomingBuses[0] || 'Unknown', date: r.userDate, time: r.userTime }); setProgress(0); setToastMessage(''); }} className="w-full bg-gray-900 hover:bg-gray-800 transition-colors text-white text-sm font-semibold rounded-xl py-3 flex justify-center items-center gap-2 shadow-sm">
                                    <Icon name="navigation" className="w-4 h-4" /> Start Journey Simulation
                                  </button>
                                </div>
                              </div>
                              {r.upcomingBuses.length > 0 && (
                                <div>
                                  <p className="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Upcoming Buses</p>
                                  <div className="flex flex-wrap gap-2">
                                    {timingsToShow.map((t, i) => <span key={i} className={`text-xs font-medium px-2.5 py-1 rounded-lg border ${i === 0 ? 'bg-red-600 text-white border-red-600' : 'bg-gray-50 text-gray-700 border-gray-200'}`}>{t.split('\u2013')[0].trim()}</span>)}
                                    {r.upcomingBuses.length > 8 && <button onClick={() => setShowAllTimings(!showAllTimings)} className="text-xs font-semibold text-red-600 hover:underline px-2">{showAllTimings ? 'Show less' : `+${r.upcomingBuses.length - 8} more`}</button>}
                                  </div>
                                </div>
                              )}
                              {r.note && <p className="text-xs text-gray-400 border-t border-gray-100 pt-3">⚠️ {r.note}</p>}
                            </div>
                          );
                        })() : (
                          <div className="text-center py-16">
                            <div className="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4"><Icon name="bus" className="w-8 h-8 text-gray-400" /></div>
                            <p className="text-gray-500 mb-2">No results yet</p>
                            <button onClick={() => setActiveTab('search')} className="mt-4 text-sm text-red-600 hover:underline">← Back to Search</button>
                          </div>
                        )}
                      </TabsContent>
                    </Tabs>
                  </CardContent>
                </Card>
              </div>
            </div>

            {/* Wave Divider */}
            <div className="absolute bottom-0 left-0 right-0">
              <svg viewBox="0 0 1440 60" fill="white" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,60 C360,0 1080,0 1440,60 L1440,60 L0,60 Z"/>
              </svg>
            </div>
          </section>

          {/* ── FEATURES ── */}
          <section id="features" className="py-24 bg-white/80 backdrop-blur-sm shadow-[0_-1px_15px_rgba(0,0,0,0.03)]">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-16 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 text-red-600 text-xs font-semibold border border-red-100 mb-4">
                  Features
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">Why Choose KSRTC Bus Finder?</h2>
                <p className="text-lg text-gray-500 max-w-2xl mx-auto">
                  Experience the most advanced bus finding platform with features designed for your convenience
                </p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                {features.map((feature, index) => (
                  <div key={index} className="reveal group p-6 rounded-2xl border border-gray-100/50 hover:border-red-200 hover:shadow-xl hover:shadow-red-900/5 transition-all duration-300 bg-white/90 card-hover" style={{transitionDelay: `${index * 50}ms`}}>
                    <div className="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center text-red-600 mb-4 group-hover:bg-red-600 group-hover:text-white transition-colors duration-300">
                      <Icon name={feature.icon} className="w-6 h-6" />
                    </div>
                    <h3 className="font-bold text-gray-900 text-lg mb-2">{feature.title}</h3>
                    <p className="text-gray-500 text-sm leading-relaxed">{feature.description}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── STATS ── */}
          <section className="py-20 bg-gradient-to-r from-red-600 to-red-700 text-white">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-12 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 text-white text-xs font-semibold border border-white/30 mb-4">
                  Trusted Platform
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-3">Trusted by Thousands</h2>
                <p className="text-red-100">Join the growing community of smart travelers</p>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                {[
                  { icon: 'users', value: '50K+', label: 'Active Users' },
                  { icon: 'bus', value: '500+', label: 'Bus Routes' },
                  { icon: 'trending-up', value: '98%', label: 'Accuracy Rate' },
                  { icon: 'star', value: '4.8/5', label: 'User Rating' },
                ].map((stat, index) => (
                  <div key={index} className="reveal text-center p-6 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-colors">
                    <div className="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-4">
                      <Icon name={stat.icon} className="w-7 h-7 text-white" />
                    </div>
                    <p className="text-4xl font-extrabold mb-1">{stat.value}</p>
                    <p className="text-red-100 text-sm">{stat.label}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── TESTIMONIALS ── */}
          <section className="py-24 bg-gray-50/80 backdrop-blur-sm">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-16 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 text-red-600 text-xs font-semibold border border-red-100 mb-4">
                  Testimonials
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">What Our Users Say</h2>
                <p className="text-lg text-gray-500">Real experiences from real travelers</p>
              </div>
              <div className="grid md:grid-cols-3 gap-6">
                {testimonials.map((t, index) => (
                  <div key={index} className="reveal p-6 rounded-2xl bg-white/90 border border-gray-100 hover:border-red-200 hover:shadow-xl transition-all card-hover">
                    <div className="flex gap-1 mb-4">
                      {[...Array(t.rating)].map((_, i) => (
                        <Icon key={i} name="star" className="w-4 h-4 text-yellow-400" />
                      ))}
                    </div>
                    <p className="text-gray-700 text-sm leading-relaxed italic mb-6">"{t.content}"</p>
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-gradient-to-br from-red-500 to-red-700 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-sm">
                        {t.name.charAt(0)}
                      </div>
                      <div>
                        <p className="font-semibold text-gray-900 text-sm">{t.name}</p>
                        <p className="text-xs text-gray-500">{t.role}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── POPULAR ROUTES ── */}
          <section id="popular-routes" className="py-24 bg-white/80 backdrop-blur-sm">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-16 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 text-white text-xs font-semibold mb-4 shadow-sm">
                  <Icon name="route" className="w-3 h-3" /> Popular Routes
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">Popular Routes</h2>
                <p className="text-lg text-gray-500">Explore the most travelled KSRTC bus routes across Karnataka</p>
              </div>
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
                {popularRoutes.map((route, index) => (
                  <div
                    key={index}
                    className={`reveal group relative rounded-2xl border-2 flex flex-col overflow-hidden transition-all duration-300 card-hover
                      ${route.highlight
                        ? 'border-red-600 shadow-xl shadow-red-900/10'
                        : 'border-gray-200 bg-white hover:border-red-300 hover:shadow-lg hover:shadow-red-900/5'
                      }`}
                    style={{transitionDelay: `${index * 60}ms`}}
                  >
                    {route.highlight && (
                      <div className="absolute top-3 left-3 z-20 pointer-events-none">
                        <span className="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md border border-red-500/50">Top Pick</span>
                      </div>
                    )}
                    
                    <div className="relative h-44 w-full bg-gray-100 flex-shrink-0 group/img border-b border-gray-100">
                      {uploadedImages[index] ? (
                        <img src={uploadedImages[index]} alt={`${route.from} to ${route.to}`} className="object-cover w-full h-full" />
                      ) : (
                        <div className="flex flex-col items-center justify-center h-full text-gray-400 bg-gradient-to-br from-gray-50 to-gray-200">
                          <Icon name="image" className="w-10 h-10 mb-2 opacity-40 transition-transform group-hover/img:scale-110 duration-500" />
                          <span className="text-sm font-semibold tracking-wide">Custom Image</span>
                        </div>
                      )}
                      
                      <div className="absolute inset-0 bg-black/50 opacity-0 group-hover/img:opacity-100 transition-opacity duration-300 flex items-center justify-center pointer-events-none backdrop-blur-[2px]">
                        <span className="text-white text-sm font-semibold flex items-center gap-2 bg-black/60 px-4 py-2 rounded-full border border-white/20 shadow-lg">
                          <Icon name="upload" className="w-4 h-4" /> Upload Photo
                        </span>
                      </div>
                      
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={(e) => handleImageUpload(index, e)} 
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
                        title="Upload Custom Route Image" 
                      />
                    </div>

                    <div className="p-6 flex-1 flex flex-col pt-5">
                      <div className="flex items-start justify-between mb-4">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-gray-900 text-base">{route.from}</span>
                          <div className="flex items-center gap-1 text-gray-400">
                            <div className="w-4 h-px bg-gray-300"></div>
                            <Icon name="bus" className="w-3.5 h-3.5 opacity-80" />
                            <div className="w-4 h-px bg-gray-300"></div>
                          </div>
                          <span className="font-bold text-gray-900 text-base">{route.to}</span>
                        </div>
                        <span className={`text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded-full flex-shrink-0 ${

                        route.type === 'Volvo AC' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'
                      }`}>{route.type}</span>
                    </div>
                    <div className="grid grid-cols-2 gap-3 mb-5">
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg bg-red-50 flex items-center justify-center flex-shrink-0">
                          <Icon name="clock" className="w-3.5 h-3.5 text-red-500" />
                        </div>
                        <div>
                          <p className="text-xs text-gray-400">Duration</p>
                          <p className="text-sm font-semibold text-gray-800">{route.duration}</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="w-7 h-7 rounded-lg bg-red-50 flex items-center justify-center flex-shrink-0">
                          <Icon name="bell" className="w-3.5 h-3.5 text-red-500" />
                        </div>
                        <div>
                          <p className="text-xs text-gray-400">Frequency</p>
                          <p className="text-sm font-semibold text-gray-800">{route.frequency}</p>
                        </div>
                      </div>
                    </div>
                    <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                      <div>
                        <p className="text-xs text-gray-400">Next Available</p>
                        <p className="text-lg font-extrabold text-gray-900">{route.nextBus}</p>
                        <div className="flex items-center gap-1.5 mt-0.5">
                          <span className={`inline-block w-1.5 h-1.5 rounded-full flex-shrink-0 ${
                            route.status === 'On Time' ? 'bg-green-500' : 'bg-amber-500'
                          }`}></span>
                          <span className={`text-xs font-medium ${
                            route.status === 'On Time' ? 'text-green-600' : 'text-amber-600'
                          }`}>{route.status} · {route.seats} seats left</span>
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          setFromDistrict(route.from === 'Bengaluru' ? 'Bangalore' : route.from);
                          setToDistrict(route.to === 'Mysuru' ? 'Mysore' : route.to);
                          setActiveTab('search');
                          window.scrollTo({ top: 0, behavior: 'smooth' });
                        }}
                        className="inline-flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-colors"
                      >
                        Search <Icon name="arrow-right" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                </div>
                ))}
              </div>
            </div>
          </section>

          {/* ── FAQ ── */}
          <section id="faq" className="py-24 bg-gray-50/80 backdrop-blur-sm">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-16 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-50 text-red-600 text-xs font-semibold border border-red-100 mb-4">
                  FAQ
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">Frequently Asked Questions</h2>
                <p className="text-lg text-gray-500">Everything you need to know about KSRTC Bus Finder</p>
              </div>
              <div className="max-w-3xl mx-auto reveal">
                <Accordion>
                  {faqs.map((faq, index) => (
                    <AccordionItem key={index} value={`item-${index}`}>
                      <AccordionTrigger>{faq.question}</AccordionTrigger>
                      <AccordionContent>{faq.answer}</AccordionContent>
                    </AccordionItem>
                  ))}
                </Accordion>
              </div>
            </div>
          </section>

          {/* ── CONTACT ── */}
          <section id="contact" className="py-24 bg-white">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="text-center mb-16 reveal">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-600 text-white text-xs font-semibold mb-4">
                  Contact Us
                </span>
                <h2 className="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">Get in Touch</h2>
                <p className="text-lg text-gray-500">Have questions? We're here to help!</p>
              </div>
              <div className="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                <div className="reveal">
                  <Card>
                    <CardHeader>
                      <CardTitle>Send us a Message</CardTitle>
                      <CardDescription>Fill out the form and we'll get back to you soon</CardDescription>
                    </CardHeader>
                    <CardContent className="space-y-4 pt-4">
                      <div>
                        <label className="text-sm font-medium text-gray-700 block mb-1.5">Name</label>
                        <Input placeholder="Your full name" value={contactForm.name} onChange={e => setContactForm({...contactForm, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="text-sm font-medium text-gray-700 block mb-1.5">Email</label>
                        <Input type="email" placeholder="your@email.com" value={contactForm.email} onChange={e => setContactForm({...contactForm, email: e.target.value})} />
                      </div>
                      <div>
                        <label className="text-sm font-medium text-gray-700 block mb-1.5">Message</label>
                        <Input placeholder="How can we help?" value={contactForm.message} onChange={e => setContactForm({...contactForm, message: e.target.value})} />
                      </div>
                      <button
                        onClick={() => { alert('Message sent! We\'ll get back to you within 24 hours.'); setContactForm({name:'',email:'',message:''}); }}
                        className="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl transition-colors text-sm"
                      >
                        Send Message
                      </button>
                    </CardContent>
                  </Card>
                </div>

                <div className="space-y-4 reveal">
                  {[
                    { icon: 'phone', title: 'Phone', line1: '+91 80 1234 5678', line2: 'Mon-Fri 9am-6pm' },
                    { icon: 'mail', title: 'Email', line1: 'support@ksrtcbusfinder.com', line2: 'We\'ll respond within 24 hours' },
                    { icon: 'map-pin', title: 'Office', line1: 'Bangalore, Karnataka', line2: 'India – 560001' },
                  ].map((info, index) => (
                    <Card key={index}>
                      <CardContent className="pt-5">
                        <div className="flex items-start gap-4">
                          <div className="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center text-red-600 flex-shrink-0">
                            <Icon name={info.icon} className="w-5 h-5" />
                          </div>
                          <div>
                            <p className="font-semibold text-gray-900 text-sm">{info.title}</p>
                            <p className="text-gray-600 text-sm mt-0.5">{info.line1}</p>
                            <p className="text-gray-400 text-xs mt-0.5">{info.line2}</p>
                          </div>
                        </div>
                      </CardContent>
                    </Card>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer className="bg-gray-950 text-white py-16">
            <div className="container mx-auto px-4 max-w-7xl">
              <div className="grid md:grid-cols-4 gap-10 mb-12">
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <div className="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center">
                      <Icon name="bus" className="w-5 h-5 text-white" />
                    </div>
                    <span className="text-lg font-bold">KSRTC Finder</span>
                  </div>
                  <p className="text-gray-400 text-sm leading-relaxed">
                    Your trusted companion for Karnataka bus travel. Find, track, and plan your journey with ease.
                  </p>
                </div>

                <div>
                  <h3 className="font-semibold mb-4 text-sm">Quick Links</h3>
                  <ul className="space-y-2.5 text-sm text-gray-400">
                    {['Home', 'Features', 'Pricing', 'Contact'].map(link => (
                      <li key={link}><a href={`#${link.toLowerCase()}`} className="hover:text-red-400 transition-colors">{link}</a></li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h3 className="font-semibold mb-4 text-sm">Resources</h3>
                  <ul className="space-y-2.5 text-sm text-gray-400">
                    {['Help Center', 'Privacy Policy', 'Terms of Service', 'API Documentation'].map(link => (
                      <li key={link}><a href="#" className="hover:text-red-400 transition-colors">{link}</a></li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h3 className="font-semibold mb-4 text-sm">Newsletter</h3>
                  <p className="text-sm text-gray-400 mb-4">Subscribe to get updates on new routes and features</p>
                  <div className="flex gap-2">
                    <input
                      type="email"
                      placeholder="Your email"
                      value={newsletterEmail}
                      onChange={e => setNewsletterEmail(e.target.value)}
                      className="flex-1 h-9 px-3 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-red-400 transition-colors"
                    />
                    <button
                      onClick={() => { if(newsletterEmail) { alert('Subscribed!'); setNewsletterEmail(''); }}}
                      className="h-9 w-9 flex items-center justify-center bg-red-600 hover:bg-red-700 rounded-lg transition-colors flex-shrink-0"
                    >
                      <Icon name="arrow-right" className="w-4 h-4 text-white" />
                    </button>
                  </div>
                </div>
              </div>

              <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-gray-500">
                <p>© 2024 KSRTC Bus Finder. All rights reserved.</p>
                <p>Made with ❤️ for Karnataka travelers</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render safely
    if (!window.__reactRoot) {
      window.__reactRoot = ReactDOM.createRoot(document.getElementById('root'));
    }
    window.__reactRoot.render(<KSRTCBusFinder />);
  </script>
</body>
</html>
